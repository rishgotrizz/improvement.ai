<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - EduPredict</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .post-reg-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
    }
    .post-reg-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .post-reg-card {
      background: #ffffff;
      width: 90%;
      max-width: 500px;
      border-radius: 14px;
      border: 2px solid #18181b;
      box-shadow: 6px 6px 0px #18181b;
      padding: 2.25rem;
      text-align: center;
    }
  </style>
</head>
<body class="paper-theme">

  <!-- Top Navigation Header -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="/" class="brand-wordmark">
        <span class="wordmark-edu">Edu</span><span class="wordmark-predict">Predict</span>
      </a>

      <nav class="nav-menu">
        <a href="/" class="nav-link">Home</a>
        <a href="/#how-it-works" class="nav-link">How It Works</a>
        <a href="/#students" class="nav-link">For Students</a>
        <a href="/about" class="nav-link">About</a>
      </nav>

      <div class="nav-right-container">
        <a href="/login" class="btn-paper-outline">LOGIN</a>
        <a href="/register" class="btn-lime active">REGISTER</a>
      </div>

      <button class="mobile-toggle" aria-label="Toggle Navigation">☰</button>
    </div>
  </header>

  <!-- Student Registration Form Container -->
  <main class="container" style="max-width: 520px; padding: 3.5rem 1rem;">
    <div class="paper-card" style="padding: 2.5rem 2rem;">
      <div style="text-align: center; margin-bottom: 1.75rem;">
        <span class="badge-lime" style="margin-bottom: 0.5rem; display: inline-block;">👨‍🎓 Student Account</span>
        <h1 style="font-size: 1.8rem; font-weight: 800; color: #18181b; margin-bottom: 0.3rem;">Register as Student</h1>
        <p style="color: #52525b; font-size: 0.9rem;">Create your personal academic tracking account</p>
      </div>

      <!-- Feedback Alert -->
      <div id="reg-alert" class="alert alert-danger" style="display: none; margin-bottom: 1.25rem;"></div>

      <form id="student-reg-form">
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="reg-name" class="form-label" style="font-size: 0.85rem; font-weight: 700;">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Aarav Sharma" required style="width: 100%;">
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="reg-username" class="form-label" style="font-size: 0.85rem; font-weight: 700;">Username / Email</label>
          <input type="text" id="reg-username" class="form-control" placeholder="Choose a username or email..." required style="width: 100%;">
        </div>

        <div class="grid grid-2" style="gap: 0.75rem; margin-bottom: 1rem;">
          <div>
            <label for="reg-password" class="form-label" style="font-size: 0.82rem; font-weight: 700;">Password</label>
            <input type="password" id="reg-password" class="form-control" placeholder="At least 6 chars" required style="width: 100%;">
          </div>
          <div>
            <label for="reg-confirm" class="form-label" style="font-size: 0.82rem; font-weight: 700;">Confirm Password</label>
            <input type="password" id="reg-confirm" class="form-control" placeholder="Re-enter password" required style="width: 100%;">
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="reg-roll" class="form-label" style="font-size: 0.85rem; font-weight: 700;">Student ID / Roll Number (Optional)</label>
          <input type="text" id="reg-roll" class="form-control" placeholder="e.g. CS2026-088" style="width: 100%;">
        </div>

        <button type="submit" id="btn-reg-submit" class="btn-lime" style="width: 100%; justify-content: center; font-size: 1rem;">
          Create Student Account →
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: #52525b;">
        Already have an account? <a href="/login" style="color: #18181b; font-weight: 700;">Log In as Student</a>
      </div>
    </div>
  </main>

  <footer class="footer" style="background: #18181b; color: #ffffff; padding: 2.5rem 0; margin-top: 4rem;">
    <div class="container" style="text-align: center;">
      <p style="font-size: 0.85rem; color: #a1a1aa;">EduPredict Learning Analytics & Early Warning System</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const alertBox = document.getElementById("reg-alert");

      document.getElementById("student-reg-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        alertBox.style.display = "none";

        const name = document.getElementById("reg-name").value.trim();
        const username = document.getElementById("reg-username").value.trim();
        const password = document.getElementById("reg-password").value;
        const confirm = document.getElementById("reg-confirm").value;
        const rollNumber = document.getElementById("reg-roll").value.trim();

        if (password !== confirm) {
          alertBox.textContent = "Passwords do not match. Please re-enter.";
          alertBox.style.display = "block";
          return;
        }

        try {
          const res = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username,
              password,
              role: "student",
              name,
              rollNumber
            })
          });
          const data = await res.json();

          if (res.ok && data.success) {
            localStorage.setItem("edupredict_user", JSON.stringify(data.user));
            const targetUrl = localStorage.getItem("edupredict_target_url") || new URLSearchParams(window.location.search).get("next") || "/dashboard";
            localStorage.removeItem("edupredict_target_url");
            window.location.href = targetUrl;
          } else {
            alertBox.textContent = data.error || "Student registration failed.";
            alertBox.style.display = "block";
          }
        } catch(err) {
          alertBox.textContent = "Network error registering student account.";
          alertBox.style.display = "block";
        }
      });
    });
  </script>
</body>
</html>
