<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Login - EduPredict</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="paper-theme">

  <!-- Top Navigation Header -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="/" class="brand-wordmark">
        <span class="wordmark-edu">Edu</span><span class="wordmark-predict">Predict</span>
      </a>

      <nav class="nav-menu">
        <a href="/" class="nav-link">Home</a>
        <a href="/#how-it-works" class="nav-link">How It Works</a>
        <a href="/#students" class="nav-link">For Students</a>
        <a href="/#faculty" class="nav-link">For Faculty</a>
        <a href="/about" class="nav-link">About</a>
      </nav>

      <div class="nav-right-container">
        <a href="/login" class="btn-paper-outline">LOGIN</a>
        <a href="/register" class="btn-lime">REGISTER</a>
      </div>

      <button class="mobile-toggle" aria-label="Toggle Navigation">☰</button>
    </div>
  </header>

  <!-- Faculty Login Form Container -->
  <main class="container" style="max-width: 480px; padding: 4rem 1rem;">
    <div class="paper-card" style="padding: 2.5rem 2rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="font-size: 2.5rem; margin-bottom: 0.4rem;">👩‍🏫</div>
        <h1 style="font-size: 1.75rem; font-weight: 800; color: #18181b; margin-bottom: 0.3rem;">Faculty Sign In</h1>
        <p style="color: #52525b; font-size: 0.9rem;">Access class intelligence and student risk analytics</p>
      </div>

      <!-- Feedback Alert -->
      <div id="login-alert" class="alert alert-danger" style="display: none; margin-bottom: 1.25rem;"></div>

      <form id="faculty-login-form">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label for="username" class="form-label" style="font-size: 0.85rem; font-weight: 700;">Username / Email</label>
          <input type="text" id="username" class="form-control" placeholder="Enter faculty username..." required value="faculty" style="width: 100%;">
        </div>

        <div class="form-group" style="margin-bottom: 1.75rem;">
          <label for="password" class="form-label" style="font-size: 0.85rem; font-weight: 700;">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter password..." required value="faculty123" style="width: 100%;">
        </div>

        <button type="submit" id="btn-login-submit" class="btn-paper-outline" style="width: 100%; justify-content: center; font-size: 1rem; margin-bottom: 1.5rem; background: #18181b; color: #ffffff;">
          Sign In to Faculty Portal →
        </button>
      </form>

      <!-- Quick Demo Fill -->
      <div style="border-top: 1px solid #e4e4e7; padding-top: 1rem; text-align: center; font-size: 0.85rem; color: #52525b;">
        <p style="margin-bottom: 0.75rem; font-weight: 700; color: #18181b;">⚡ Quick Demo Account</p>
        <button type="button" id="demo-faculty-fill" class="btn-paper-outline" style="font-size: 0.82rem; padding: 0.4rem 0.85rem; width: 100%;">
          Fill Demo Credentials (faculty / faculty123)
        </button>
      </div>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: #52525b;">
        Don't have a faculty account? <a href="/register/faculty" style="color: #18181b; font-weight: 700;">Register as Faculty</a>
      </div>
    </div>
  </main>

  <footer class="footer" style="background: #18181b; color: #ffffff; padding: 2.5rem 0; margin-top: 4rem;">
    <div class="container" style="text-align: center;">
      <p style="font-size: 0.85rem; color: #a1a1aa;">EduPredict Learning Analytics & Early Warning System</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const loginForm = document.getElementById("faculty-login-form");
      const alertBox = document.getElementById("login-alert");

      document.getElementById("demo-faculty-fill").addEventListener("click", () => {
        usernameInput.value = "faculty";
        passwordInput.value = "faculty123";
      });

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertBox.style.display = "none";

        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();

          if (res.ok && data.success) {
            localStorage.setItem("edupredict_user", JSON.stringify(data.user));
            const targetUrl = localStorage.getItem("edupredict_target_url") || new URLSearchParams(window.location.search).get("next") || "/faculty";
            localStorage.removeItem("edupredict_target_url");
            window.location.href = targetUrl;
          } else {
            alertBox.textContent = data.error || "Authentication failed. Invalid credentials.";
            alertBox.style.display = "block";
          }
        } catch(err) {
          alertBox.textContent = "Network error connecting to login service.";
          alertBox.style.display = "block";
        }
      });
    });
  </script>
</body>
</html>
